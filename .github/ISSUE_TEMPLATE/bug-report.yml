{
  "name": "Bug report",
  "description": "Report a reproducible application problem",
  "body": [
    {
      "type": "markdown",
      "attributes": {
        "value": "Do not post personal information, confidential data, credentials or unreviewed camera images. This repository is public. Describe observed behaviour without unsupported accuracy claims."
      }
    },
    {
      "type": "textarea",
      "id": "field-0",
      "attributes": {
        "label": "App version"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "field-1",
      "attributes": {
        "label": "Android version"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "field-2",
      "attributes": {
        "label": "Smartphone model"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "field-3",
      "attributes": {
        "label": "Camera configuration"
      },
      "validations": {
        "required": false
      }
    },
    {
      "type": "textarea",
      "id": "field-4",
      "attributes": {
        "label": "Steps to reproduce"
      },
      "validations": {
        "required": false
      }
    },
    {
      "type": "textarea",
      "id": "field-5",
      "attributes": {
        "label": "Expected behavior"
      },
      "validations": {
        "required": false
      }
    },
    {
      "type": "textarea",
      "id": "field-6",
      "attributes": {
        "label": "Actual behavior"
      },
      "validations": {
        "required": false
      }
    },
    {
      "type": "textarea",
      "id": "field-7",
      "attributes": {
        "label": "Diagnostic information"
      },
      "validations": {
        "required": false
      }
    },
    {
      "type": "textarea",
      "id": "field-8",
      "attributes": {
        "label": "Screenshots or CSV, if available"
      },
      "validations": {
        "required": false
      }
    }
  ]
}
